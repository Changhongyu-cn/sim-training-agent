<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仿真训练智能监控 Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 800px; max-width: 95%; height: 90vh; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .header { background: linear-gradient(135deg, #1a2a6c, #2d4373); color: white; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; }
        .header .badge { background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; background: #f8fafc; }
        .message { margin-bottom: 16px; display: flex; flex-direction: column; }
        .message.user { align-items: flex-end; }
        .message.agent { align-items: flex-start; }
        .message .bubble { max-width: 75%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
        .message.user .bubble { background: #1a2a6c; color: white; border-bottom-right-radius: 4px; }
        .message.agent .bubble { background: white; color: #1a1a2e; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }
        .message .label { font-size: 12px; color: #64748b; margin-bottom: 4px; padding: 0 4px; }
        .input-area { padding: 16px 20px; background: white; border-top: 1px solid #e2e8f0; display: flex; gap: 12px; }
        .input-area input { flex: 1; padding: 10px 16px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; outline: none; }
        .input-area input:focus { border-color: #1a2a6c; }
        .input-area button { padding: 10px 24px; background: #1a2a6c; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
        .input-area button:hover { background: #2d4373; }
        .input-area button:disabled { background: #94a3b8; cursor: not-allowed; }
        .status { padding: 8px 20px; font-size: 12px; color: #64748b; background: #f1f5f9; border-top: 1px solid #e2e8f0; }
        .status .loading::after { content: '...'; animation: dots 1.2s steps(3) infinite; }
        @keyframes dots { 0%, 20% { content: ''; } 40% { content: '.'; } 60% { content: '..'; } 80%, 100% { content: '...'; } }
        .quick-questions { padding: 8px 20px 12px; background: #f8fafc; display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid #e2e8f0; }
        .quick-questions button { background: #e2e8f0; border: none; padding: 4px 12px; border-radius: 16px; font-size: 12px; color: #1a2a6c; cursor: pointer; }
        .quick-questions button:hover { background: #cbd5e1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 仿真训练智能监控 Agent</h1>
            <span class="badge">DeepSeek + ES</span>
        </div>
        <div class="quick-questions">
            <button onclick="sendMessage('当前训练总数据有多少条？')">📊 查询总数</button>
            <button onclick="sendMessage('帮我看看最近5条数据的reward')">📈 最新5条</button>
            <button onclick="sendMessage('分析一下训练趋势')">📉 趋势分析</button>
            <button onclick="sendMessage('总结一下当前训练效果')">📋 效果总结</button>
        </div>
        <div class="chat-box" id="chatBox">
            <div class="message agent">
                <span class="label">🤖 Agent</span>
                <div class="bubble">👋 你好！我是仿真训练监控 Agent，可以查询训练数据、分析 reward 趋势、总结训练效果。试试上面的快捷问题吧！</div>
            </div>
        </div>
        <div class="status" id="status">就绪</div>
        <div class="input-area">
            <input type="text" id="inputField" placeholder="输入问题..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>
    <script>
        const chatBox = document.getElementById('chatBox');
        const inputField = document.getElementById('inputField');
        const sendBtn = document.getElementById('sendBtn');
        const statusEl = document.getElementById('status');

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            const label = document.createElement('span');
            label.className = 'label';
            label.textContent = role === 'user' ? '🧑 你' : '🤖 Agent';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = content;
            div.appendChild(label);
            div.appendChild(bubble);
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function setStatus(text, loading = false) {
            statusEl.innerHTML = text + (loading ? ' <span class="loading">处理中</span>' : '');
        }

async function sendMessage(msg) {
    const text = msg || inputField.value.trim();
    if (!text) return;
    inputField.value = '';
    addMessage('user', text);
    setStatus('Agent 思考中...', true);
    sendBtn.disabled = true;
    try {
        const response = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
        });
        const data = await response.json();
        console.log('后端返回数据:', data); // 在控制台打印，方便调试
        
        // 检查返回的数据结构
        if (data.error) {
            addMessage('agent', '❌ 错误: ' + data.error);
        } else if (data.output) {
            // 使用 data.output 显示内容
            addMessage('agent', data.output);
        } else if (data.response) {
            // 兼容其他可能的字段名
            addMessage('agent', data.response);
        } else {
            // 如果都没有，显示整个数据对象（防止无响应）
            addMessage('agent', JSON.stringify(data, null, 2));
        }
    } catch (e) {
        console.error('请求错误:', e);
        addMessage('agent', '❌ 连接错误: ' + e.message);
    }
    setStatus('就绪');
    sendBtn.disabled = false;
    chatBox.scrollTop = chatBox.scrollHeight;
}
    </script>
</body>
</html>
